<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <circle cx="950" cy="315" r="240" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="950" cy="315" r="320" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.2"/>

  <!-- Left Content -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect width="320" height="40" rx="20" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0">🌱 VAST ENERGY CELL INITIATIVE</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">CarbonCalculator</text>
    
    <!-- Tagline -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#34d399">Understand. Calculate. Reduce.</text>
    
    <!-- Description -->
    <text x="0" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Interactive carbon footprint tracking, daily green challenges,</text>
    <text x="0" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">and sustainability awareness for students, colleges, and communities.</text>

    <!-- Footer Tag -->
    <text x="0" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Vidya Academy of Science &amp; Technology (VAST) NSS Cell</text>
  </g>

  <!-- Illustration on Right -->
  <g transform="translate(850, 215)">
    <circle cx="100" cy="100" r="100" fill="#047857" opacity="0.8"/>
    <path d="M50 150 C 40 90, 90 50, 150 60 C 140 120, 100 160, 50 150 Z" fill="url(#leafGrad)"/>
    <path d="M60 140 C 80 115, 110 95, 140 70" stroke="#ecfdf5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="130" cy="120" r="14" fill="#38bdf8"/>
    <circle cx="75" cy="85" r="10" fill="#fbbf24"/>
  </g>
</svg>
