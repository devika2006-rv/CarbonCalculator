services:
  - type: web
    name: carboncalculator
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client && npm install --prefix server
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@vastenergycell.in
      - key: ADMIN_PASSWORD
        value: vastEnergyCell@2026
